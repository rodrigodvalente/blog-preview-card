<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/blog-preview-card/assets/favicon-32x32.png" type="image/png">
    <link rel="stylesheet" href="/blog-preview-card/styles/reset.css">
    <link rel="stylesheet" href="/blog-preview-card/styles/style.css">
    <title>Blog preview Card</title>
</head>
<body>
    <div class="container">
        <main class="card__box">
            <img src="/blog-preview-card/assets/illustration-article.svg" alt="coding image" class="card__image">
            <article class="card__content">
                <p class="card__tag">Learning</p>
                <p class="card__date">Published 21 Dec 2023</p>
                <h1 class="card__title">HTML & CSS foundations</h1>
                <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                <cite class="author__box">
                    <img src="/blog-preview-card/assets/image-avatar.webp" alt="Greg Hooper photo" class="author__image">
                    <p class="author__name">Greg Hooper</p>
                </cite>
            </article>
        </main>
    </div>
</body>
</html>
